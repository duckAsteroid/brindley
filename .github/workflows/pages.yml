name: Docs site

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/changelog.mjs", "scripts/canal-history.mjs", "src/**", "initiatives/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated timestamps, the Releases page and the progress report come from git history
      # checkout can leave annotated tags as plain ones; refetch them so tag messages (release highlights) are there.
      - run: git fetch --force --tags origin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Brindley itself, built from this commit: it writes the progress pages below.
      - run: npm ci
        working-directory: .
      # The guide's canal examples, from a scripted history; and Brindley's own progress, from this one.
      - run: node scripts/canal-history.mjs site/public/examples
        working-directory: .
      - run: node dist/cli.js report --out site/public/progress.html
        working-directory: .
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
