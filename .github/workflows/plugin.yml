name: Plugin

# Validates the Claude Code plugins and their marketplace, and tests the sidebar, whenever any of them changes.
on:
  push:
    paths: ["plugin/**", "sidebar/**", ".claude-plugin/**", "scripts/plugin-version.mjs", ".github/workflows/plugin.yml"]
  pull_request:
    paths: ["plugin/**", "sidebar/**", ".claude-plugin/**", "scripts/plugin-version.mjs", ".github/workflows/plugin.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.308 plugin validate --strict .

      - name: Validate the plugin
        run: npx -y @anthropic-ai/claude-code@2.1.308 plugin validate --strict plugin

      - name: Validate the sidebar
        run: npx -y @anthropic-ai/claude-code@2.1.308 plugin validate --strict sidebar

      - name: Test the sidebar
        run: npx -y @anthropic-ai/claude-code@2.1.308 plugin test sidebar

      - name: Check the plugin files all pin the same version
        run: node scripts/plugin-version.mjs --check "$(node -p 'require("./plugin/.claude-plugin/plugin.json").version')"
