name: Release

# Publishes to npm when a release tag (vX.Y.Z) is pushed:
#   npm run release:prepare   (commits the plugin at the next version)
#   git tag -a v1.2.3 -m "<highlights>" && git push origin main v1.2.3
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing + provenance
  actions: write # start the docs-site build after a release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is computed from git tags

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Before the npm upgrade below: under npm@latest, npx skips Claude Code's postinstall,
      # which fetches its native binary.
      - name: Validate the Claude Code plugin
        run: |
          npx -y @anthropic-ai/claude-code@2.1.308 plugin validate --strict .
          npx -y @anthropic-ai/claude-code@2.1.308 plugin validate --strict plugin

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check the computed version matches the tag
        run: |
          computed="$(node scripts/version.mjs)"
          tagged="${GITHUB_REF_NAME#v}"
          echo "tag: $tagged  computed: $computed"
          if [ "$computed" != "$tagged" ]; then
            echo "::error::Computed version $computed does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      # Claude Code reads the plugin from main, so the release commit must already pin this version.
      - name: Check the plugin pins the tagged version
        run: node scripts/plugin-version.mjs --check "${GITHUB_REF_NAME#v}"

      - run: npm test

      # npm reads the version before any lifecycle script runs, so set it first.
      - name: Set package.json version from git
        run: npm run version:sync

      # prepack builds dist/ (stamping the same version into the server).
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # Optional: only needed until trusted publishing is configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # checkout can leave the annotated tag as a plain one; refetch so its message (the highlights) is there.
      - name: Write release notes
        run: |
          git fetch --force --tags origin
          node scripts/changelog.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      # Rebuild the docs site so its Releases page shows this release. It runs on main: the
      # github-pages environment only deploys from main, not from a tag.
      - name: Rebuild the docs site
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
